<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ORCA - Marine Intelligence Assistant</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  * { box-sizing: border-box; font-family: -apple-system, Segoe UI, Roboto, sans-serif; }
  body { margin: 0; display: flex; height: 100vh; background: #0d1b2a; }
  #chat-panel { width: 420px; display: flex; flex-direction: column; background: #f5f7fa; }
  #header { padding: 16px; background: #0d3b66; color: white; }
  #header h1 { margin: 0; font-size: 18px; }
  #header p { margin: 4px 0 0; font-size: 13px; opacity: 0.8; }
  #messages { flex: 1; overflow-y: auto; padding: 16px; }
  .msg { margin-bottom: 12px; padding: 10px 14px; border-radius: 10px; max-width: 90%; font-size: 14px; line-height: 1.4; }
  .msg.user { background: #0d3b66; color: white; margin-left: auto; }
  .msg.bot { background: white; border: 1px solid #ddd; }
  .risk-tag { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 12px; font-weight: bold; margin-bottom: 6px; }
  .risk-safe { background: #d4edda; color: #155724; }
  .risk-caution { background: #fff3cd; color: #856404; }
  .risk-unsafe { background: #f8d7da; color: #721c24; }
  #input-row { display: flex; padding: 12px; border-top: 1px solid #ddd; background: white; }
  #query-input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
  #send-btn { margin-left: 8px; padding: 10px 18px; background: #0d3b66; color: white; border: none; border-radius: 6px; cursor: pointer; }
  #send-btn:hover { background: #0a2d4d; }
  #mic-btn { margin-left: 8px; padding: 10px 14px; background: #f5f7fa; color: #0d3b66; border: 1px solid #ccc; border-radius: 6px; cursor: pointer; font-size: 16px; }
  #mic-btn:hover { background: #e9edf2; }
  #mic-btn.listening { background: #dc3545; color: white; border-color: #dc3545; animation: pulse 1s infinite; }
  @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }
  #lang-row { display: flex; gap: 6px; padding: 8px 16px 0; align-items: center; }
  #lang-row span { font-size: 12px; color: #666; margin-right: 4px; }
  .lang-btn { padding: 4px 10px; font-size: 12px; border: 1px solid #ccc; background: white; border-radius: 12px; cursor: pointer; color: #333; }
  .lang-btn.active { background: #0d3b66; color: white; border-color: #0d3b66; }
  #map { flex: 1; }
  .examples { padding: 0 16px 12px; font-size: 12px; color: #666; }
  .examples button { display: block; width: 100%; text-align: left; background: none; border: none; color: #0d3b66; padding: 4px 0; cursor: pointer; font-size: 12px; }

  /* Phase 6: dynamic stakeholder risk dashboard card */
  .risk-card { background: white; border: 1px solid #ddd; border-radius: 10px; padding: 14px; margin-bottom: 12px; font-size: 13px; }
  .risk-card-title { font-weight: bold; font-size: 13px; color: #0d3b66; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.3px; }
  .risk-overall-row { margin-bottom: 12px; }
  .risk-overall-badge { display: inline-block; padding: 4px 10px; border-radius: 6px; font-weight: bold; font-size: 13px; }
  .risk-badge-low { background: #d4edda; color: #155724; }
  .risk-badge-moderate { background: #fff3cd; color: #856404; }
  .risk-badge-high { background: #ffe0cc; color: #9c4500; }
  .risk-badge-critical { background: #f8d7da; color: #721c24; }
  .risk-metric-row { margin-bottom: 8px; }
  .risk-metric-label { display: flex; justify-content: space-between; font-size: 12px; color: #333; margin-bottom: 3px; }
  .risk-bar-track { background: #eee; border-radius: 6px; height: 8px; overflow: hidden; }
  .risk-bar-fill { height: 100%; border-radius: 6px; transition: width 0.4s ease; }
  .risk-recommendation { margin-top: 10px; padding-top: 10px; border-top: 1px solid #eee; font-size: 12px; color: #333; }
  .risk-recommendation b { color: #0d3b66; }
</style>
</head>
<body>

<div id="chat-panel">
  <div id="header">
    <h1>ORCA</h1>
    <p>Marine Intelligence Assistant (prototype - demo data)</p>
  </div>
  <div id="messages"></div>
  <div class="examples">
    Try: 
    <button onclick="askExample('Is it safe to fish tomorrow near Kochi?')">Is it safe to fish tomorrow near Kochi?</button>
    <button onclick="askExample('Should I go to sea near Chennai today?')">Should I go to sea near Chennai today?</button>
    <button onclick="askExample('What are the conditions near Visakhapatnam?')">What are the conditions near Visakhapatnam?</button>
  </div>
  <div id="lang-row">
    <span>Speak in:</span>
    <button class="lang-btn active" data-lang="en-IN" onclick="setSpeechLang(this)">English</button>
    <button class="lang-btn" data-lang="hi-IN" onclick="setSpeechLang(this)">हिंदी</button>
    <button class="lang-btn" data-lang="mr-IN" onclick="setSpeechLang(this)">मराठी</button>
  </div>
  <div id="input-row">
    <input id="query-input" type="text" placeholder="Ask about fishing safety, e.g. Kochi..." onkeydown="if(event.key==='Enter') sendQuery()">
    <button id="mic-btn" onclick="toggleListening()" title="Speak your question">🎤</button>
    <button id="send-btn" onclick="sendQuery()">Ask</button>
  </div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const API_URL = "http://localhost:8000/ask";

  // View is locked to south/central India (where all demo locations are)
  // so the map never scrolls up to the Kashmir region, whose boundary
  // rendering differs between global map providers and India's official map.
  const southIndiaBounds = L.latLngBounds([5, 70], [21, 90]);

  const map = L.map('map', {
    maxBounds: southIndiaBounds,
    maxBoundsViscosity: 1.0,
    minZoom: 6
  }).setView([13, 79], 6);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  let markers = [];

  function clearMarkers() {
    markers.forEach(m => map.removeLayer(m));
    markers = [];
  }

  function addMessage(text, sender, riskLevel) {
    const messages = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = 'msg ' + sender;
    if (riskLevel) {
      const tag = document.createElement('div');
      tag.className = 'risk-tag risk-' + riskLevel;
      tag.textContent = riskLevel.toUpperCase();
      div.appendChild(tag);
      div.appendChild(document.createElement('br'));
    }
    div.appendChild(document.createTextNode(text));
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
  }

  function askExample(text) {
    document.getElementById('query-input').value = text;
    sendQuery();
  }

  // ---------- Phase 6: dynamic stakeholder risk dashboard ----------
  const STAKEHOLDER_DASHBOARD_TITLES = {
    fisherman: '🎣 ORCA Fishing Safety',
    coast_guard: '🛟 ORCA Maritime Risk',
    disaster_management: '🚨 ORCA Disaster Risk',
    general: '📊 ORCA Risk Analysis',
  };

  const LEVEL_EMOJIS = { LOW: '🟢', MODERATE: '🟡', HIGH: '🟠', CRITICAL: '🔴' };

  function scoreToColor(score) {
    if (score >= 75) return '#dc3545'; // red
    if (score >= 50) return '#fd7e14'; // orange
    if (score >= 25) return '#ffc107'; // yellow
    return '#28a745'; // green
  }

  function renderRiskCard(stakeholder, risk) {
    const stakeholderType = (stakeholder && stakeholder.type) || 'general';
    const title = STAKEHOLDER_DASHBOARD_TITLES[stakeholderType] || STAKEHOLDER_DASHBOARD_TITLES.general;
    const level = risk.overall_level || 'LOW';
    const emoji = LEVEL_EMOJIS[level] || '⚪';
    const levelClass = 'risk-badge-' + level.toLowerCase();

    // Bars are built entirely from the backend's numeric scores below -
    // never hardcoded. If wave_risk = 20, this renders a 20%-wide bar;
    // if it's 90, the bar is 90% wide, automatically.
    const metricsHtml = (risk.metrics || []).map(m => `
      <div class="risk-metric-row">
        <div class="risk-metric-label"><span>${m.name}</span><span>${m.score}%</span></div>
        <div class="risk-bar-track">
          <div class="risk-bar-fill" style="width: ${m.score}%; background: ${scoreToColor(m.score)};"></div>
        </div>
      </div>
    `).join('');

    const card = document.createElement('div');
    card.className = 'risk-card';
    card.innerHTML = `
      <div class="risk-card-title">${title}</div>
      <div class="risk-overall-row">
        <span class="risk-overall-badge ${levelClass}">${emoji} ${level} \u2014 ${risk.overall_score}/100</span>
      </div>
      ${metricsHtml}
      <div class="risk-recommendation"><b>Recommendation:</b> ${risk.recommendation || ''}</div>
    `;

    const messages = document.getElementById('messages');
    messages.appendChild(card);
    messages.scrollTop = messages.scrollHeight;
  }

  // ---------- Voice input (Web Speech API - built into Chrome/Edge, free, no API key) ----------
  let selectedSpeechLang = 'en-IN';
  let recognition = null;
  let isListening = false;

  const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;

  function setSpeechLang(btn) {
    selectedSpeechLang = btn.dataset.lang;
    document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }

  function toggleListening() {
    if (!SpeechRecognitionAPI) {
      addMessage("Voice input isn't supported in this browser. Please try Chrome or Edge, or type your question instead.", 'bot');
      return;
    }

    if (isListening) {
      recognition.stop();
      return;
    }

    recognition = new SpeechRecognitionAPI();
    recognition.lang = selectedSpeechLang;
    recognition.continuous = false;
    recognition.interimResults = false;

    const micBtn = document.getElementById('mic-btn');

    recognition.onstart = () => {
      isListening = true;
      micBtn.classList.add('listening');
      micBtn.textContent = '⏺';
    };

    recognition.onresult = (event) => {
      const transcript = event.results[0][0].transcript;
      // Populate the input field so the user can review/edit before sending,
      // rather than auto-submitting straight from voice - gives a chance to
      // correct any misheard words before it goes to the backend.
      document.getElementById('query-input').value = transcript;
    };

    recognition.onerror = (event) => {
      addMessage(`Voice input error: ${event.error}. Please try again or type your question.`, 'bot');
    };

    recognition.onend = () => {
      isListening = false;
      micBtn.classList.remove('listening');
      micBtn.textContent = '🎤';
    };

    recognition.start();
  }

  async function sendQuery() {
    const input = document.getElementById('query-input');
    const query = input.value.trim();
    if (!query) return;

    addMessage(query, 'user');
    input.value = '';

    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query })
      });
      const data = await res.json();

      if (data.error) {
        addMessage(data.answer, 'bot');
        return;
      }

      addMessage(data.answer, 'bot', data.risk_level);

      // Phase 6: render the stakeholder-specific risk dashboard, if present
      // (it won't be, on the error path, since risk is null there).
      if (data.risk && data.stakeholder) {
        renderRiskCard(data.stakeholder, data.risk);
      }

      clearMarkers();
      const userLoc = data.map.user_location;
      const pfz = data.map.nearest_pfz;

      const userMarker = L.marker([userLoc.lat, userLoc.lon])
        .addTo(map)
        .bindPopup(`<b>${data.map.location_name}</b>`);
      markers.push(userMarker);

      // Guard: nearest_pfz can now be null for a non-demo geocoded city
      // (Phase 4's live-geocoding feature), so only render this marker
      // when PFZ data actually exists.
      if (pfz) {
        const pfzMarker = L.marker([pfz.lat, pfz.lon])
          .addTo(map)
          .bindPopup(`<b>${pfz.name}</b><br>${pfz.distance_km} km away`);
        markers.push(pfzMarker);
      }

      map.setView([userLoc.lat, userLoc.lon], 8);

    } catch (err) {
      addMessage("Could not reach the backend. Is it running on localhost:8000?", 'bot');
    }
  }
</script>

</body>
</html>
